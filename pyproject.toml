[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacgate-dp"
version = "0.1.0"
description = "TacGate-DP: time-modality gated tactile conditioning for diffusion policies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "diffusers>=0.30,<1",
    "einops>=0.7,<1",
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "pyarrow>=12",
    "zarr>=2.16,<4",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7,<4"]

[project.scripts]
tacgate-train = "tactile_gate_policy.train:main"
tacgate-evaluate = "tactile_gate_policy.evaluate:main"
tacgate-rollout = "tactile_gate_policy.rollout:main"
tgp-train = "tactile_gate_policy.train:main"
tgp-evaluate = "tactile_gate_policy.evaluate:main"
tgp-rollout = "tactile_gate_policy.rollout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tactile_gate_policy = ["vendor/LICENSE.diffusion_policy"]
"tactile_gate_policy.vendor.diffusion_policy" = ["LICENSE"]
